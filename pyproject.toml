# Конфигурационный файл Python-проекта: метаданные, зависимости Poetry и настройки линтеров.

[project]
name = "one-percent-tracker"
version = "0.1.0"
description = "Бэкенд трекера полезных привычек на основе книги «Атомные привычки»"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0,<6.1)",
    "django-environ (==0.14.0)",
    "psycopg2-binary (>=2.9.9,<3.0.0)",
    "djangorestframework (>=3.15.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.3.1,<6.0.0)",
    "django-cors-headers (>=4.3.1,<5.0.0)",
    "drf-spectacular (>=0.27.2,<1.0.0)",
    "django-filter (==26.2)",
    "celery (>=5.4.0,<6.0.0)",
    "redis (==8.2.0)",
    "django-celery-beat (>=2.6.0,<3.0.0)",
    "requests (>=2.31.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Настройки линтеров и форматтеров
[tool.black]
line-length = 119

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv|migrations'

[tool.poetry]
package-mode = false

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "djangorestframework-stubs (>=3.18.2,<4.0.0)",
]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-django (>=4.9.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]
